name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  XK6_VERSION: v1.4.10

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install xk6
        run: go install go.k6.io/xk6/cmd/xk6@${{ env.XK6_VERSION }}

      - name: Build k6 with xk6-iroha
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out=k6-iroha
          [ "$GOOS" = "windows" ] && out=k6-iroha.exe
          k6_version=$(go list -m -f '{{.Version}}' go.k6.io/k6/v2)
          xk6 build "$k6_version" --with github.com/ishinvin/xk6-iroha@${{ github.ref_name }} --output "$out"

      - name: Package
        id: package
        run: |
          name="xk6-iroha-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p xk6-iroha/types
          cp types/xk6-iroha.d.ts xk6-iroha/types/
          if [ "${{ matrix.goos }}" = "windows" ]; then
            asset="$name.zip"
            cp k6-iroha.exe xk6-iroha/
            zip -r "$asset" xk6-iroha
          else
            asset="$name.tar.gz"
            cp k6-iroha xk6-iroha/
            tar -czf "$asset" xk6-iroha
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.package.outputs.asset }}
