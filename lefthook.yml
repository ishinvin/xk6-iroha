# https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.go"
      run: golangci-lint run ./...

pre-push:
  parallel: false
  jobs:
    - name: lint
      glob: "*.go"
      run: golangci-lint run ./...

    - name: test
      glob: "*.go"
      run: go test -v -count=1 -timeout 180s ./...
